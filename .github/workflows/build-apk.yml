name: Build Urbex-T Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
      - 'app/**'
      - 'settings.gradle.kts'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Android project directory
        id: locate
        run: |
          if [ -f "settings.gradle.kts" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "android/settings.gradle.kts" ]; then
            echo "dir=android" >> "$GITHUB_OUTPUT"
          else
            echo "Could not find settings.gradle.kts in root or android/" >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK (API 35)
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMGR=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f | head -n 1)
          if [ -z "$SDKMGR" ]; then
            echo "sdkmanager not found under $SDK_DIR/cmdline-tools" >&2
            exit 1
          fi
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests (:core and :domain)
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle :core:testDebugUnitTest :domain:testDebugUnitTest --no-daemon

      - name: Prepare Release Keystore
        run: |
          KEYSTORE_PATH="${{ runner.temp }}/urbex-release.jks"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_PATH" \
            -storetype PKCS12 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias "urbex-release" \
            -storepass "urbext-release-keystore" \
            -keypass "urbext-release-keystore" \
            -dname "CN=Urbex-T, OU=FieldPDA, O=Urbex-T, L=Field, C=RU"
          echo "URBEX_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "URBEX_KEYSTORE_PASS=urbext-release-keystore" >> "$GITHUB_ENV"
          echo "URBEX_KEY_ALIAS=urbex-release" >> "$GITHUB_ENV"
          echo "URBEX_KEY_PASS=urbext-release-keystore" >> "$GITHUB_ENV"

      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle :app:assembleDebug --no-daemon

      - name: Build Signed Release APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify APK Signatures
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          APKSIGNER="${ANDROID_HOME}/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/debug/*.apk
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/*.apk

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: urbex-t-debug-apk
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Signed Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: urbex-t-release-apk
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
