name: Build Urbex-T Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
      - 'app/**'
      - 'settings.gradle.kts'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Android project directory
        id: locate
        run: |
          if [ -f "settings.gradle.kts" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "android/settings.gradle.kts" ]; then
            echo "dir=android" >> "$GITHUB_OUTPUT"
          else
            echo "Could not find settings.gradle.kts in root or android/" >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests (:core and :domain)
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle :core:testDebugUnitTest :domain:testDebugUnitTest --no-daemon

      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle :app:assembleDebug --no-daemon

      - name: Build Unsigned Release APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: urbex-t-debug-apk
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release Unsigned APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: urbex-t-release-unsigned-apk
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
